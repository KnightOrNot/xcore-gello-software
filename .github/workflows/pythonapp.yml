name: Python application

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: "0 0 * * 0"

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      MUJOCO_GL: disable
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install offline-test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e . pytest ruff dm_control omegaconf==2.3.0 pyzmq tyro termcolor dynamixel-sdk
      - name: Check Python syntax and undefined names
        run: |
          ruff check xcore_gello_software tests --select E9,F63,F7,F82
      - name: Test leader mapping and headless gripper physics
        run: |
          pytest -q xcore_gello_software/dynamixel/tests tests
